<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HomeOps" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>HomeOps</title>
    <script>
      // A Safari web app on macOS (Add to Dock) draws the page under its title bar,
      // where the window buttons sit; reserve that strip. Phones use safe-area insets.
      try {
        var ua = navigator.userAgent
        if (/Macintosh/.test(ua) && !/Chrome|Chromium|Edg|Firefox/.test(ua) && navigator.maxTouchPoints === 0 &&
            (matchMedia('(display-mode: standalone)').matches || navigator.standalone))
          document.documentElement.classList.add('mac-webapp')
      } catch (e) {}
      // Apply the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme') || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app never draws (its code failed to load or start), offer a way out instead
      // of a blank screen: drop saved data and the installed copy, then load fresh.
      setTimeout(function () {
        var root = document.getElementById('root')
        if (!root || root.childElementCount) return
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font:14px system-ui,sans-serif">' +
          '<b style="font-size:16px">HomeOps didn’t start</b><span style="opacity:.7">Reload to fetch the latest version.</span>' +
          '<button id="ho-reset" style="height:36px;padding:0 16px;border:0;border-radius:6px;background:#1d4ed8;color:#fff;font:inherit">Reload HomeOps</button></div>'
        document.getElementById('ho-reset').onclick = function () {
          var done = function () { location.replace('/') }
          try { indexedDB.deleteDatabase('keyval-store') } catch (e) {}
          Promise.all([
            navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }) : 0,
            window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }) : 0,
          ]).then(done, done)
        }
      }, 12000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
