<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HomeOps" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>HomeOps</title>
    <script>
      // A Safari web app on macOS (Add to Dock) draws the page under its title bar,
      // where the window buttons sit; reserve that strip. Phones use safe-area insets.
      try {
        var ua = navigator.userAgent
        if (/Macintosh/.test(ua) && !/Chrome|Chromium|Edg|Firefox/.test(ua) && navigator.maxTouchPoints === 0 &&
            (matchMedia('(display-mode: standalone)').matches || navigator.standalone))
          document.documentElement.classList.add('mac-webapp')
      } catch (e) {}
      // Apply the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme') || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
