# Roundcube webmail for the Cloudflare Tunnel — loopback only.
server {
    listen 127.0.0.1:8282;
    server_name _;
    root /opt/roundcube/current/public_html;
    index index.php;
    client_max_body_size 30m;
    server_tokens off;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Never serve config, logs, temp files or installer.
    location ~ ^/(config|temp|logs|bin|SQL|installer|vendor)/ { deny all; }
    location = /installer.php { deny all; }
    location ~ /\. { deny all; }

    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_param HTTPS on;
        # Webmail code may only touch its own files, data and config.
        fastcgi_param PHP_VALUE "open_basedir=/opt/roundcube/:/var/lib/roundcube-homeops/:/etc/roundcube-homeops/:/var/lib/php/sessions/:/usr/share/php/:/tmp/
upload_max_filesize=25M
post_max_size=30M
expose_php=Off";
    }
}
