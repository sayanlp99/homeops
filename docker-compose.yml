name: homeops

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: homeops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeops -d homeops"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for uploads (recipe photos, receipts). Internal only:
  # files are served through the app, behind sign-in.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint-homeops.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - seaweed:/data
      - ./infra/seaweedfs/entrypoint.sh:/entrypoint-homeops.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  app:
    build: .
    image: homeops:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://homeops:${POSTGRES_PASSWORD}@db:5432/homeops?sslmode=disable
      HOMEOPS_PUBLIC_URL: ${HOMEOPS_PUBLIC_URL:?set HOMEOPS_PUBLIC_URL in .env}
      HOMEOPS_VAPID_EMAIL: ${HOMEOPS_VAPID_EMAIL:?set HOMEOPS_VAPID_EMAIL in .env}
      HOMEOPS_S3_ENDPOINT: seaweedfs:8333
      HOMEOPS_S3_BUCKET: homeops
      HOMEOPS_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      HOMEOPS_S3_SECRET_KEY: ${S3_SECRET_KEY}
    # Only reachable from this machine; the outside world comes in through the tunnel.
    ports:
      - "127.0.0.1:${HOMEOPS_LOCAL_PORT:-8080}:8080"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - app

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: homeops
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: homeops
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./backups:/backups
      - ./infra/backup.sh:/backup.sh:ro
      - seaweed:/seaweed:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  pgdata:
  seaweed:
