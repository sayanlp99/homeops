name: homeops

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: homeops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeops -d homeops"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: homeops:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://homeops:${POSTGRES_PASSWORD}@db:5432/homeops?sslmode=disable
      HOMEOPS_PUBLIC_URL: ${HOMEOPS_PUBLIC_URL:?set HOMEOPS_PUBLIC_URL in .env}
      HOMEOPS_VAPID_EMAIL: ${HOMEOPS_VAPID_EMAIL:?set HOMEOPS_VAPID_EMAIL in .env}
    # Only reachable from this machine; the outside world comes in through the tunnel.
    ports:
      - "127.0.0.1:${HOMEOPS_LOCAL_PORT:-8080}:8080"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - app

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: homeops
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: homeops
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./backups:/backups
      - ./infra/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  pgdata:
